version: 'feature/bootstrap'

schema-version: 'v1'

profiles:
  default:
    docker:
      cli: 'docker'
      project-name: "ASDF"
      bake:
        user-configs-dir: ""
        config-selectors: []
        image-registry: ""
        image-local-registry: ""
      compose:
        user-configs-dir: ""
        config-selectors: []

    vscode:
      cli: 'code'
      settings:
        user-configs-dir: ""
        config-selectors: []
        deployment-file: /path/to/settings.json
      dev-container-settings:
        cli: 'devcontainer'
        user-configs-dir: ""
        config-selectors: []
        deployment-file: /path/to/devcontainer.json

    dev-container:
      git:
        username: strenv(GIT_USERNAME)
        email: strenv(GIT_EMAIL)
        ssh-sign-key-file: strenv(GIT_SSH_SIGN_KEY_FILE)
      github:
        username: strenv(GITHUB_USERNAME)
        ssh-auth-key-file: strenv(GITHUB_SSH_AUTH_KEY_FILE)
      vnc-server:
        password: '012345'
        geometry: '1920x1080'
