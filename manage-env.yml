version: 'feature/bootstrap'

schema-version: 'v1'

profiles:
  default:
    docker:
      project-name: "ASDF"
      bake:
        user-configs-dir: ""
        config-scopes: []
        image-registry: ""
        image-local-registry: ""
      compose:
        user-configs-dir: ""
        config-scopes: []

    vscode:
      settings:
        user-configs-dir: "./.vscode"
        config-scopes:
          - "ms-vscode.powershell"
          - "github.vscode-github-actions"
          - "phil294.git-log--graph"
          - "timonwong.shellcheck"
        deployment-file: "./.vscode/settings.json"
      dev-container-settings:
        user-configs-dir: "./.devcontainer"
        deployment-file: "./.devcontainer/devcontainer.json"

    dev-container:
      git:
        username: strenv(GIT_USERNAME)
        email: strenv(GIT_EMAIL)
        ssh-sign-key-file: strenv(GIT_SSH_SIGN_KEY_FILE)
      github:
        username: strenv(GITHUB_USERNAME)
        ssh-auth-key-file: strenv(GITHUB_SSH_AUTH_KEY_FILE)
      vnc-server:
        password: '012345'
        geometry: '1920x1080'
