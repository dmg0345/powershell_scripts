version: 'feature/bootstrap'

schema-version: 1

profiles:
  default:
    docker:
      project-name: "powershell-scripts"
      bake:
        user-configs-dir: "./.docker"
        config-scopes:
          - "vscode"
        image-registry: "${BAKE_IMAGE_REGISTRY}"
        image-local-registry: "localuser/localregistry"
      compose:
        user-configs-dir: "./.docker"
        config-scopes:
          - "vscode"

    vscode:
      settings:
        user-configs-dir: "./.vscode"
        config-scopes:
          - "ms-vscode.powershell"
          - "github.vscode-github-actions"
          - "phil294.git-log--graph"
          - "mkhl.shfmt"
        deployment-file: "./.vscode/settings.json"
      dev-container-settings:
        user-configs-dir: "./.devcontainer"
        deployment-file: "./.devcontainer/devcontainer.json"

    dev-container:
      git:
        username: "${GIT_USERNAME}"
        email: "${GIT_EMAIL}"
        ssh-sign-key-file: "${GIT_SSH_SIGN_KEY_FILE}"
      github:
        username: "${GITHUB_USERNAME}"
        ssh-auth-key-file: strenv(GITHUB_SSH_AUTH_KEY_FILE)
      vnc-server:
        password: "012345"
        geometry: "1920x1080"
