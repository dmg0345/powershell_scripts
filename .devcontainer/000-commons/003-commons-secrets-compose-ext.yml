# Commons for Secrets Docker Compose Extensions File, for details, refer to: 
#   - https://docs.docker.com/compose/compose-file/
# Do not edit manually — changes will be overwritten.

# Git secrets for '/secrets' map.
x-secrets-git: &secrets-git !override
  git-ssh-sign-key-file:
    name: ${COMPOSE_PROJECT_NAME}-git-ssh-sign-key-file
    file: ${GIT_SSH_SIGN_KEY_FILE:?Please provide a path in the host to Git SSH signing key}

# Github secrets for '/secrets' map.
x-secrets-github: &secrets-github !override
  github-ssh-auth-key-file: 
    name: ${COMPOSE_PROJECT_NAME}-github-ssh-auth-key-file
    file: ${GITHUB_SSH_AUTH_KEY_FILE:?Please provide a path in the host to Github SSH authentication key}
